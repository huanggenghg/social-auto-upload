[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "opub"
version = "0.6.2"
description = "Social media auto uploader"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
  {name = "hgeng", email = "huanggenghg@gmail.com"},
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
]
keywords = ["social-media", "auto-upload", "video", "douyin", "xiaohongshu", "kuaishou", "weibo", "opub"]
dependencies = [
  "loguru==0.7.3",
  "opencv-python>=4.13.0.92",
  "patchright==1.58.2",
  "qrcode==8.2",
  "requests==2.32.3",
  "segno>=1.6.6",
]

[project.urls]
Homepage = "https://github.com/huanggenghg/opub"
Repository = "https://github.com/huanggenghg/opub"
Issues = "https://github.com/huanggenghg/opub/issues"

[project.scripts]
opub = "publish_all:main"

[tool.uv]
package = true

[tool.setuptools]
py-modules = ["conf", "publish_all"]
include-package-data = true

[tool.setuptools.packages.find]
include = ["uploader*", "utils*", "publish*"]

[tool.setuptools.package-data]
utils = ["stealth.min.js"]
